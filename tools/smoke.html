<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>deepcore smoke</title>
    <link rel="stylesheet" href="../styles/game.css" />
    <style>
      /* The canvas is present so the renderer has a real context to draw into,
         but it is off-screen: this page reports text, not pixels. */
      #game { position: fixed; left: -2000px; top: 0; }
      #out { padding: 16px; font: 12px/1.5 monospace; color: #e8eef8; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      The browser harness.

      tests/selftest.mjs proves the simulation is correct in Node, but Node has
      no canvas, no DOM and no Web Audio, so it cannot prove the page boots. A
      single bad import path, a null 2D context or a throwing render call is
      invisible to Node and fatal in the browser.

      So this page imports every module the game imports, builds the real atlas,
      draws real frames into a real canvas, mounts the real HUD, opens every
      menu, plays every sound cue, and drills a real tunnel - then writes the
      result into #out, which tools/smoke.mjs reads back with --dump-dom.
    -->
    <pre id="out">running</pre>
    <canvas id="game"></canvas>
    <div id="app"></div>

    <script type="module">
      const lines = [];
      const log = (s) => lines.push(s);
      /**
       * A passing check that has something worth saying.
       *
       * Checks must not return a bare string to mean "pass, with a note": a
       * string is the failure channel, and conflating the two makes a harness
       * that reports failures as passes. This wraps the note in a shape `check`
       * can tell apart from a reason for failing.
       */
      const ok = (note) => ({ ok: true, note });
      /** Awaits the body, so an async check reports its real result rather than
          a truthy Promise. */
      const check = async (name, fn) => {
        try {
          const v = await fn();
          if (v === true) log(`PASS  ${name}`);
          else if (v === false) log(`FAIL  ${name}`);
          else if (v && v.ok) log(`PASS  ${name} -> ${v.note}`);
          else log(`FAIL  ${name} -> ${String(v)}`);
        } catch (e) {
          log(`FAIL  ${name} (${e && e.message ? e.message : e})`);
        }
      };

      window.addEventListener('error', (e) => log(`FAIL  window.onerror: ${e.message}`));
      window.addEventListener('unhandledrejection', (e) => log(`FAIL  unhandled rejection: ${e.reason}`));

      function finish() {
        document.getElementById('out').textContent = lines.join('\n');
        try { fetch('/__result__/smoke%20done'); } catch { /* the beacon is optional */ }
      }

      try {
        /* ---------- imports ---------- */
        const names = [
          'config', 'sim/rng', 'sim/world', 'sim/physics', 'sim/game', 'sim/save',
          'render/camera', 'render/palette', 'render/atlas', 'render/buildings', 'render/world',
          'render/ship', 'render/fx', 'hud', 'menus', 'input', 'audio',
        ];
        const mods = {};
        for (const name of names) {
          try {
            mods[name] = await import(`../src/${name}.js`);
            log(`PASS  import ${name}.js`);
          } catch (e) {
            log(`FAIL  import ${name}.js -> ${e.message}`);
          }
        }

        const G = mods['sim/game'];
        const C = mods['render/camera'];
        const AT = mods['render/atlas'];
        const RW = mods['render/world'];
        const RS = mods['render/ship'];
        const FX = mods['render/fx'];
        const HUD = mods['hud'];
        const ME = mods['menus'];
        const IN = mods['input'];
        const SAVE = mods['sim/save'];
        const CFG = mods['config'];
        const FACILITIES = CFG.FACILITIES;
        // ROWS lives in config, not in the world module: reading `W.ROWS` here
        // silently produced NaN and made the deep-frame check blame the renderer
        // for a bad coordinate.

        if (!G || !C || !AT || !RW || !RS || !FX || !HUD || !ME || !IN) {
          log('FAIL  HARNESS CRASH: a required module did not import');
          finish();
        } else {

        /* ---------- the atlas ---------- */
        let atlas = null;
        await check('buildAtlas produces a full set of correctly sized sprites', () => {
          atlas = AT.buildAtlas();
          if (!atlas.rock.length) return 'no rock sprites';
          const bad = atlas.rock.findIndex((c) => !c || c.width !== 32 * AT.SS);
          if (bad >= 0) return `rock sprite ${bad} is missing or the wrong size`;
          if (atlas.ore.size < 10) return `only ${atlas.ore.size} ore sprites`;
          for (const [, variants] of atlas.ore) {
            if (variants.length !== 4) return 'an ore has the wrong number of variants';
          }
          if (atlas.crack.length !== 4) return 'wrong number of crack overlays';
          return true;
        });

        await check('the rock sprites carry texture, and neighbouring tiles differ', () => {
          /**
           * The rock used to be three tones in 6px blocks, which made a 32px tile
           * five blocks across and a wall of rock a flat mosaic. Two properties
           * together are what fixed it, and either one alone is not enough:
           *
           *   - a tile has to have real tonal spread, or it is a flat colour with
           *     a couple of specks on it;
           *   - neighbouring tiles have to differ, or a wall tiles visibly and the
           *     eye reads the repeat instead of the rock.
           *
           * Spread is measured as the standard deviation of luma across the
           * sprite, which is scale-free and so does not need re-tuning when the
           * palette changes.
           */
          for (let band = 0; band < 8; band += 1) {
            for (let v = 0; v < 4; v += 1) {
              const sprite = atlas.rock[band * 4 + v];
              if (!sprite) return `rock sprite ${band * 4 + v} is missing`;
              const d = sprite.getContext('2d').getImageData(0, 0, sprite.width, sprite.height).data;
              const lum = [];
              for (let i = 0; i < d.length; i += 4) {
                if (d[i + 3] === 0) continue;
                lum.push(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]);
              }
              if (lum.length < sprite.width * sprite.height * 0.5) {
                return `rock sprite ${band * 4 + v} is more than half cut away`;
              }
              const mean = lum.reduce((a, b) => a + b, 0) / lum.length;
              const sd = Math.sqrt(lum.reduce((a, b) => a + (b - mean) ** 2, 0) / lum.length);
              if (sd < 4) {
                return `rock sprite ${band * 4 + v} is nearly flat `
                  + `(luma spread ${sd.toFixed(2)}) - it has no texture`;
              }
            }
          }

          // Variants of the same band must not be the same tile.
          for (const band of [0, 3, 7]) {
            const a = atlas.rock[band * 4].getContext('2d').getImageData(0, 0, 64, 64).data;
            const b = atlas.rock[band * 4 + 1].getContext('2d').getImageData(0, 0, 64, 64).data;
            let diff = 0;
            for (let i = 0; i < a.length; i += 4) if (a[i] !== b[i]) diff += 1;
            const frac = diff / (a.length / 4);
            if (frac < 0.2) {
              return `band ${band}'s variants are only ${(frac * 100).toFixed(0)}% different `
                + `- a wall of them will tile visibly`;
            }
          }
          return true;
        });

        await check('nothing in the tile art is anti-aliased', () => {
          /**
           * Every sprite is drawn from whole-pixel `fillRect`s, so every pixel is
           * either fully opaque or fully transparent. A single canvas `stroke` or
           * `arc` - which is how the cracks used to be drawn - leaves partially
           * transparent pixels, and those land as grey haze against exact
           * colours.
           *
           * This is the guard for that: a half-transparent pixel anywhere in the
           * atlas means something started drawing with a vector primitive.
           */
          const all = [
            ...atlas.rock, ...atlas.gas, ...atlas.lava, ...atlas.crack,
            ...[...atlas.ore.values()].flat(),
          ];
          for (const sprite of all) {
            if (!sprite) return 'the atlas has a hole in it';
            const d = sprite.getContext('2d').getImageData(0, 0, sprite.width, sprite.height).data;
            for (let i = 3; i < d.length; i += 4) {
              if (d[i] !== 0 && d[i] !== 255) {
                const px = ((i - 3) / 4) % sprite.width;
                const py = Math.floor(((i - 3) / 4) / sprite.width);
                return `a sprite has a half-transparent pixel (alpha ${d[i]}) at ${px},${py} `
                  + `- something is drawing with an anti-aliased primitive`;
              }
            }
          }
          return ok(`${all.length} sprites, all pixels fully opaque or fully clear`);
        });

        /* ---------- rendering into a real context ---------- */
        const canvas = document.getElementById('game');
        canvas.width = 800;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');
        const state = G.createState(4242);
        const cam = C.createCamera(800, 500);
        C.updateCamera(cam, state.ship, 0.016);
        const origin = C.camOrigin(cam);

        await check('a full world frame draws without throwing', () => {
          RW.drawSky(ctx, cam, origin, 800, 500);
          RW.drawSurface(ctx, origin, 0);
          RW.drawTiles(ctx, state.world, origin, 800, 500, atlas);
          RW.drawNatas(ctx, origin, 0);
          RS.drawShip(ctx, state, origin, 0, 1.2);
          FX.drawDust(ctx, FX.createFx(), origin);
          FX.drawPops(ctx, state, origin);
          FX.drawHeatTint(ctx, 800, 500, 0, 0);
          FX.drawCrt(ctx, 800, 500);
          return true;
        });

        await check('a frame at the bottom of the mine draws', () => {
          const deep = G.createState(99);
          deep.ship.y = (CFG.ROWS - 30) * CFG.TILE;
          deep.depth = G.depthAt(deep.ship.y);
          C.updateCamera(cam, deep.ship, 0.5);
          const o = C.camOrigin(cam);
          // Each call is named so a failure points at the function rather than
          // at the whole frame.
          const steps = {
            drawTiles: () => RW.drawTiles(ctx, deep.world, o, 800, 500, atlas),
            drawNatas: () => RW.drawNatas(ctx, o, 1),
            drawHeatTint: () => FX.drawHeatTint(ctx, 800, 500, 0, 1),
          };
          for (const [name, fn] of Object.entries(steps)) {
            try {
              fn();
            } catch (e) {
              return `${name} threw: ${e.message}`;
            }
          }
          if (!Number.isFinite(deep.depth)) return 'depth went non-finite';
          if (!Number.isFinite(o.x) || !Number.isFinite(o.y)) return `origin is ${o.x},${o.y}`;
          return true;
        });

        await check('the surface buildings are distinct silhouettes, not one box recoloured', () => {
          /**
           * The three buildings used to be the same rectangle drawn three times
           * with a different coloured strip, which is why the surface looked
           * empty: there was no shape to look at and nothing to tell them apart
           * until you were close enough to read the strip.
           *
           * So the property worth asserting is about the *outline*, not the
           * colour. This samples the silhouette of each building - the topmost
           * drawn pixel in every column across its width - and requires that the
           * three outlines differ from each other, and that each one has a shape
           * rather than a single flat height.
           *
           * The sky is not drawn here, so clouds cannot leak into the profile,
           * and the treeline is skipped near the buildings by design, so what is
           * measured is only the building.
           */
          const groundY = CFG.SURFACE_ROW * CFG.TILE + 140;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          // A background no part of the art uses, so "drawn" is unambiguous.
          ctx.fillStyle = '#ff00ff';
          ctx.fillRect(0, 0, 800, 500);
          // Shifted down so the tallest building (the processor's chimney) fits
          // on the canvas instead of being clipped at the top edge.
          RW.drawSurface(ctx, { x: 0, y: -140 }, 0);
          const data = ctx.getImageData(0, 0, 800, 500).data;

          const profileOf = (cx) => {
            const out = [];
            for (let x = cx - 60; x <= cx + 60; x += 1) {
              let top = groundY;
              for (let y = 0; y < groundY; y += 1) {
                const i = (y * 800 + x) * 4;
                if (data[i] !== 255 || data[i + 1] !== 0 || data[i + 2] !== 255) { top = y; break; }
              }
              out.push(top);
            }
            return out;
          };

          const profiles = FACILITIES.map((f) => profileOf(f.col * CFG.TILE));

          for (let i = 0; i < profiles.length; i += 1) {
            const tallest = Math.min(...profiles[i]);
            if (tallest >= groundY - 8) {
              return `${FACILITIES[i].name} draws nothing above the ground`;
            }
          }

          for (let a = 0; a < profiles.length; a += 1) {
            for (let b = a + 1; b < profiles.length; b += 1) {
              let differing = 0;
              for (let k = 0; k < profiles[a].length; k += 1) {
                if (Math.abs(profiles[a][k] - profiles[b][k]) >= 4) differing += 1;
              }
              const frac = differing / profiles[a].length;
              if (frac < 0.15) {
                return `${FACILITIES[a].name} and ${FACILITIES[b].name} have nearly the same `
                  + `outline (only ${(frac * 100).toFixed(0)}% of columns differ)`;
              }
            }
          }

          for (let i = 0; i < profiles.length; i += 1) {
            const heights = new Set(profiles[i]);
            if (heights.size < 5) {
              return `${FACILITIES[i].name} is a featureless box `
                + `(${heights.size} distinct heights across its whole width)`;
            }
          }

          const tall = profiles.map((p) => groundY - Math.min(...p));
          return ok(`${tall.join('/')}px tall, three distinct outlines`);
        });

        /* ---------- particles ---------- */
        await check('dust is emitted while drilling and expires afterwards', () => {
          const fx = FX.createFx();
          const s = G.createState(5);
          s.ship.drilling = true;
          for (let i = 0; i < 200; i += 1) FX.updateFx(fx, s, 1 / 60, origin, 800, 500);
          if (!fx.dust.length) return 'no dust was emitted while drilling';
          s.ship.drilling = false;
          for (let i = 0; i < 400; i += 1) FX.updateFx(fx, s, 1 / 60, origin, 800, 500);
          if (fx.dust.length > 4) return `${fx.dust.length} dust particles never expired`;
          return true;
        });

        /* ---------- the HUD ---------- */
        await check('the HUD mounts and renders real values', () => {
          const root = document.getElementById('app');
          const hud = HUD.createHud(root);
          for (let i = 0; i < 5; i += 1) hud.update(state, { lowFuel: false, lowHull: false });
          const cash = root.querySelector('.stat-cash .stat-value');
          if (!cash) return 'no cash readout in the DOM';
          if (!cash.textContent.includes('€')) return `cash reads "${cash.textContent}"`;
          const depth = root.querySelector('.stat-depth .stat-value');
          if (!depth || !depth.textContent.includes('ft')) return 'no depth readout';
          if (!root.querySelector('.gauge')) return 'no depth gauge';
          if (!root.querySelector('.radar')) return 'no radar';
          if (root.querySelectorAll('.meter').length !== 3) return 'wrong number of meters';
          /**
           * The Slovenian labels are longer than the English ones they replaced
           * ("GORIVO" against "FUEL", "PRORAČUN" against "CREDITS"), and a label
           * that no longer fits its column wraps or spills rather than throwing.
           * An overflowing grid item reports a wider scroll box than its client
           * box, which is the cheapest way to catch it without a screenshot.
           */
          for (const node of root.querySelectorAll('.meter-name, .stat-label, .stat-value')) {
            if (node.scrollWidth > node.clientWidth + 1) {
              return `"${node.textContent}" overflows its column (${node.scrollWidth} > ${node.clientWidth})`;
            }
          }
          hud.toast('hello', 'info', 100);
          if (!root.querySelector('.toast')) return 'toast did not appear';
          return true;
        });

        /* ---------- the menus ---------- */
        await check('every menu opens and closes', () => {
          const root = document.getElementById('app');
          const t = ME.showTitle(root, { onStart() {}, onContinue() {}, hasSave: false, onHelp() {} });
          if (!root.querySelector('.modal-title')) return 'title did not mount';
          t.close();
          if (root.querySelector('.modal-title')) return 'title did not close';

          ME.showHelp(root);
          if (!root.querySelector('.help-grid')) return 'help did not mount';
          root.querySelector('.modal-close').click();

          ME.showPause(root, { onResume() {}, onSave() {}, onQuit() {}, muted: false, onToggleSound() {} });
          if (!root.querySelector('.modal')) return 'pause did not mount';
          root.querySelector('.modal-close').click();

          ME.showShop(root, state, { onSpend() {}, onClose() {}, initialTab: 'ship' });
          if (!root.querySelector('.shop')) return 'shop did not mount';
          if (!root.querySelector('.pane.is-active')) return 'no shop tab is active';
          const activePanes = root.querySelectorAll('.pane.is-active').length;
          if (activePanes !== 1) return `${activePanes} shop panes are visible at once`;
          if (!root.querySelector('.tab.is-active')) return 'no tab is highlighted';
          root.querySelector('.modal-close').click();

          ME.showEnd(root, state, { won: false, onRestart() {}, onContinue() {} });
          if (!root.querySelector('.end-stats')) return 'end screen did not mount';
          root.querySelector('.modal-close').click();
          return true;
        });

        await check('the shop spends money and the prices come from the tables', () => {
          const root = document.getElementById('app');
          const s = G.createState(1);
          s.cash = 100000;
          const before = G.drillPower(s);
          ME.showShop(root, s, { onSpend() {}, onClose() {}, initialTab: 'ship' });
          const buy = root.querySelector('.pane.is-active .btn-buy');
          if (!buy) return 'no buy button rendered';
          buy.click();
          if (G.drillPower(s) <= before) return 'buying the first drill changed nothing';
          root.querySelector('.modal-close').click();
          return true;
        });

        await check('the title screen carries no agency branding, and the text keeps its diacritics', () => {
          /**
           * The Slovenian letters have to be real characters rather than escaped
           * or mangled bytes - a half-converted file is the failure this guards.
           *
           * The letters are checked as *code points* against the rendered text,
           * not as literals in this file: an assertion written in the same
           * alphabet it is testing cannot tell a good conversion from a bad one.
           *
           * The branding assertion is the inverse of what it used to be. The
           * title used to carry a boxed acronym and a state agency's full name;
           * the game is back to its own name, so this now fails if any of that
           * creeps back in - including the facility names, which carried it too.
           */
          const root = document.getElementById('app');
          const t = ME.showTitle(root, { onStart() {}, onContinue() {}, hasSave: false, onHelp() {} });
          const titleText = root.textContent || '';
          if (/RNOV|Razvoj in nadzor/.test(titleText)) {
            return `the title screen still carries agency branding: "${titleText.trim().slice(0, 60)}"`;
          }
          // The facilities are named on the title screen's neighbours, not here,
          // so check the table itself - that is where the names come from.
          const branded = FACILITIES.filter((f) => /RNOV/i.test(f.name + ' ' + f.note));
          if (branded.length) return `facility "${branded[0].name}" still carries agency branding`;
          t.close();

          ME.showHelp(root);
          const prose = Array.from(root.querySelectorAll('.help-grid, .help-list, .help-head'))
            .map((n) => n.textContent).join(' ');
          const codes = new Set(Array.from(prose).map((c) => c.charCodeAt(0)));
          // [name, lowercase, uppercase] for c-caron, s-caron, z-caron.
          for (const [name, lower, upper] of [
            ['c-caron', 0x010D, 0x010C],
            ['s-caron', 0x0161, 0x0160],
            ['z-caron', 0x017E, 0x017D],
          ]) {
            if (!codes.has(lower) && !codes.has(upper)) {
              return `the help text has lost ${name} - the file is not proper UTF-8`;
            }
          }
          root.querySelector('.modal-close').click();

          // And the money is euros, grouped with dots.
          ME.showShop(root, state, { onSpend() {}, onClose() {}, initialTab: 'counter' });
          const cash = root.querySelector('.shop-cash strong');
          if (!cash || !/^\d{1,3}(\.\d{3})*\s€$/.test(cash.textContent)) {
            return `the shop shows cash as "${cash && cash.textContent}"`;
          }
          root.querySelector('.modal-close').click();
          return ok(`unbranded title, carons intact, cash ${cash.textContent}`);
        });

        /* ---------- input ---------- */
        await check('keyboard input maps to the sim input shape', () => {
          const input = IN.createInput(window);
          const send = (type, code) => window.dispatchEvent(new KeyboardEvent(type, { code }));
          send('keydown', 'KeyA');
          send('keydown', 'Space');
          const held = input.read();
          if (!held.left) return 'KeyA did not set left';
          if (!held.drill) return 'Space did not set drill';
          send('keyup', 'KeyA');
          send('keyup', 'Space');
          const released = input.read();
          if (released.left) return 'KeyA stayed held after keyup';
          if (released.drill) return 'Space stayed held after keyup';
          send('keydown', 'KeyE');
          if (!input.consume('use')) return 'KeyE did not queue the use action';
          if (input.consume('use')) return 'the use action fired twice';
          input.destroy();
          return true;
        });

        /* ---------- audio ---------- */
        await check('the audio graph builds and every cue plays', () => {
          const a = mods.audio.createAudio();
          if (!a.unlock()) return 'AudioContext unavailable';
          const cues = ['orePickup', 'holdFull', 'blast', 'gasBurst', 'damage', 'sale',
            'purchase', 'deny', 'dock', 'teleport', 'death', 'win', 'click', 'alarm'];
          for (const cue of cues) {
            if (typeof a[cue] !== 'function') return `missing cue ${cue}`;
            if (cue === 'orePickup') a[cue](4);
            else if (cue === 'sale') a[cue](99999);
            else a[cue]();
          }
          a.update(state, 1.4, 0.016);
          a.setMuted(true);
          a.setMuted(false);
          return true;
        });

        /* ---------- a real session, in the browser ---------- */
        await check('40 seconds of drilling digs, fills the hold and stays consistent', () => {
          const s = G.createState(777);
          const input = { left: 0, right: 0, up: 0, down: 0, drill: 1 };
          for (let i = 0; i < 60 * 40; i += 1) G.step(s, 1 / 60, input);
          if (s.stats.dug < 10) return `only dug ${s.stats.dug} tiles in 40s`;
          if (s.cargoWeight <= 0) return 'nothing in the hold after 40s';
          if (s.cargoWeight > G.cargoCap(s) + 0.001) return 'the hold overflowed';
          if (s.ship.fuel < 0) return 'fuel went negative';
          return true;
        });

        await check('a save survives a real localStorage round trip', () => {
          const s = G.createState(31337);
          for (let i = 0; i < 600; i += 1) {
            G.step(s, 1 / 60, { left: 0, right: 0, up: 0, down: 0, drill: 1 });
          }
          if (!SAVE.saveTo(s)) return 'saveTo reported failure';
          const back = SAVE.loadFrom();
          if (!back) return 'loadFrom returned null';
          if (Math.abs(back.depth - s.depth) > 1e-6) return 'depth changed across the save';
          if (back.stats.dug !== s.stats.dug) return 'dug count changed across the save';
          if (back.cargoWeight !== s.cargoWeight) return 'the hold changed across the save';
          SAVE.clearSave();
          return true;
        });

        /* ---------- the page itself ---------- */
        /* ---------- pixels ----------
           "Does it look right" is not an assertion, but a few things about the
           picture are objectively checkable, and they are exactly the things
           that break silently: the headlight stops working, the depth palette
           stops changing, the darkness never comes on. These sample the real
           canvas and assert on the numbers. */

        /** Renders one frame at a depth and returns the pixel data. */
        const frameAt = (row) => {
          const s = G.createState(2024);
          s.ship.x = 12.5 * 32;
          s.ship.y = row * 32;
          s.depth = G.depthAt(s.ship.y);
          const c2 = C.createCamera(800, 500);
          c2.x = s.ship.x;
          c2.y = s.ship.y;
          C.updateCamera(c2, s.ship, 1);
          const o = C.camOrigin(c2);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = '#04060c';
          ctx.fillRect(0, 0, 800, 500);
          RW.drawSky(ctx, c2, o, 800, 500);
          RW.drawSurface(ctx, o, 0);
          RW.drawTiles(ctx, s.world, o, 800, 500, atlas);
          RS.drawShip(ctx, s, o, 0, 0);
          const data = ctx.getImageData(0, 0, 800, 500).data;
          return { data, origin: o, state: s };
        };

        const luma = (data, x, y) => {
          const i = (y * 800 + x) * 4;
          return 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
        };
        const avgLuma = (data) => {
          let sum = 0;
          for (let i = 0; i < data.length; i += 4) {
            sum += 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
          }
          return sum / (data.length / 4);
        };
        const avgChannel = (data, channel) => {
          let sum = 0;
          for (let i = channel; i < data.length; i += 4) sum += data[i];
          return sum / (data.length / 4);
        };

        await check('there is no fog of war: brightness does not fall off with distance', () => {
          /**
           * The mine used to be a circle of light around the pod with darkness
           * everywhere else, so what this has to prove is that *brightness no
           * longer depends on where the pod is*.
           *
           * The earlier version of this check counted pixels above a fixed luma
           * and failed at 75%. That was measuring the wrong thing: it went red
           * the moment the deep rock got legitimately darker, because "dark" and
           * "fogged" are not the same property. Deep rock at 9,600 ft is supposed
           * to be nearly black - that is the depth progression working - and a
           * threshold on absolute brightness cannot tell the two apart.
           *
           * Comparing a ring near the pod against the far corners can: with fog
           * the near ring is far brighter than the corners, and with no fog the
           * two match because the light is uniform across the view.
           */
          const { data } = frameAt(300);
          let nearSum = 0;
          let nearN = 0;
          let farSum = 0;
          let farN = 0;
          for (let y = 0; y < 500; y += 2) {
            for (let x = 0; x < 800; x += 2) {
              const d = Math.hypot(x - 400, y - 250);
              // Skip the pod itself: it is bright by design and sits in the
              // middle, which is exactly the thing being measured around.
              if (d > 60 && d < 150) { nearSum += luma(data, x, y); nearN += 1; }
              else if (d > 320) { farSum += luma(data, x, y); farN += 1; }
            }
          }
          if (!nearN || !farN) return 'the sampling rings missed the frame';
          const near = nearSum / nearN;
          const far = farSum / farN;
          if (near > far * 1.35) {
            return `rock near the pod reads ${near.toFixed(1)} luma against ${far.toFixed(1)} far away - that is a light falloff`;
          }
          if (near < 3) return `the whole view is black (${near.toFixed(1)}) - nothing is being drawn`;
          return ok(`near ${near.toFixed(1)} vs far ${far.toFixed(1)} - flat lighting`);
        });

        await check('the rock gets darker with depth', () => {
          const shallow = avgLuma(frameAt(20).data);
          const deep = avgLuma(frameAt(300).data);
          if (!(deep < shallow * 0.85)) {
            return `shallow ${shallow.toFixed(1)} vs deep ${deep.toFixed(1)} - the rock palette is not deepening`;
          }
          return ok(`shallow ${shallow.toFixed(1)} -> deep ${deep.toFixed(1)}`);
        });

        await check('the rock changes colour with depth', () => {
          const shallow = frameAt(20).data;
          const deep = frameAt(330).data;
          // The surface rock is warm (red > blue); the deep rock is cold and
          // dark (blue >= red). If the palette stopped interpolating these
          // ratios would match.
          const warmRatio = avgChannel(shallow, 0) / Math.max(1, avgChannel(shallow, 2));
          const coldRatio = avgChannel(deep, 0) / Math.max(1, avgChannel(deep, 2));
          if (!(warmRatio > coldRatio + 0.05)) {
            return `shallow r/b ${warmRatio.toFixed(2)} vs deep ${coldRatio.toFixed(2)} - the palette is flat`;
          }
          return ok(`shallow r/b ${warmRatio.toFixed(2)} -> deep ${coldRatio.toFixed(2)}`);
        });

        await check('ore is visibly brighter than the rock around it', () => {
          const { data, state: s } = frameAt(120);
          // Find an ore tile that is on screen and compare it to a rock tile.
          let orePixels = 0;
          let oreSum = 0;
          let rockPixels = 0;
          let rockSum = 0;
          for (let y = 20; y < 480; y += 2) {
            for (let x = 20; x < 780; x += 2) {
              const i = (y * 800 + x) * 4;
              const v = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
              if (v > 90) { orePixels += 1; oreSum += v; } else if (v > 4 && v < 60) { rockPixels += 1; rockSum += v; }
            }
          }
          if (!orePixels) return 'nothing on screen is brighter than 90 luma - no ore is standing out';
          if (!rockPixels) return 'no mid-dark rock pixels found';
          const oreAvg = oreSum / orePixels;
          const rockAvg = rockSum / rockPixels;
          if (!(oreAvg > rockAvg * 1.5)) {
            return `ore ${oreAvg.toFixed(1)} vs rock ${rockAvg.toFixed(1)} - ore does not pop`;
          }
          return ok(`ore ${oreAvg.toFixed(1)} vs rock ${rockAvg.toFixed(1)} (${orePixels} bright px)`);
        });

        await check('the bit points at the rock instead of sweeping through every direction', () => {
          /**
           * Renders the pod alone on a black canvas, aimed two different ways,
           * and finds where the orange of the bit actually ends up.
           *
           * The bug this pins: the whole cone used to be rotated by the spin
           * angle, so the bit swung round like a clock hand and its position
           * hardly depended on which way the pod was cutting. Sampling the
           * centroid is what makes that visible - a spinning bit has a centroid
           * near the mount in every orientation.
           */
          const bitCentroid = (dir) => {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 200, 200);
            const s = G.createState(4242);
            s.ship.x = 100;
            s.ship.y = 100;
            s.ship.vx = 0;
            s.ship.vy = 0;
            s.ship.drilling = true;
            s.ship.drillDir = dir;
            RS.drawShip(ctx, s, { x: 0, y: 0 }, 0, 1.0);
            const d = ctx.getImageData(0, 0, 200, 200).data;
            let n = 0;
            let sx = 0;
            let sy = 0;
            for (let y = 0; y < 200; y += 1) {
              for (let x = 0; x < 200; x += 1) {
                const i = (y * 200 + x) * 4;
                // The darker orange half of the cone is the only thing on the
                // pod in this range, so it stands in for the bit.
                if (d[i] > 200 && d[i + 1] > 110 && d[i + 1] < 200 && d[i + 2] < 90) {
                  n += 1;
                  sx += x;
                  sy += y;
                }
              }
            }
            if (!n) return null;
            return { n, x: sx / n - 100, y: sy / n - 100 };
          };

          const down = bitCentroid('down');
          const right = bitCentroid('right');
          if (!down || !right) return 'no drill pixels found in either orientation';
          if (!(down.y > 4)) return `aimed down, the bit sits at y ${down.y.toFixed(1)} - not below the pod`;
          if (!(right.x > 4)) return `aimed right, the bit sits at x ${right.x.toFixed(1)} - not beside the pod`;
          if (Math.abs(down.y - right.y) < 3) return 'the bit barely moved between the two orientations';
          return ok(`bit ${down.y.toFixed(1)}px below aimed down, ${right.x.toFixed(1)}px right aimed right`);
        });

        await check('the sky is flat bands, not a smooth gradient', () => {
          // Flat colour is the whole point of the art direction, and a gradient
          // is the easiest thing to reintroduce by accident. A vertical column
          // through a banded sky holds a handful of colours; through a gradient
          // it holds one per row.
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = '#04060c';
          ctx.fillRect(0, 0, 800, 500);
          const c4 = C.createCamera(800, 500);
          c4.x = 400;
          c4.y = 80;
          RW.drawSky(ctx, c4, C.camOrigin(c4), 800, 500);
          const d = ctx.getImageData(0, 0, 800, 500).data;
          const seen = new Set();
          for (let y = 0; y < 260; y += 1) {
            const i = (y * 800 + 40) * 4;
            seen.add(`${d[i]},${d[i + 1]},${d[i + 2]}`);
          }
          if (seen.size > 16) {
            return `a sky column holds ${seen.size} distinct colours - that is a gradient, not bands`;
          }
          return ok(`${seen.size} colours down a sky column`);
        });

        await check('the sky paints above ground and is skipped entirely at depth', () => {
          /**
           * Probes the sky alone, on a known blank canvas.
           *
           * This used to compare the whole surface frame against the whole deep
           * frame and lean on the fog to make the deep one darker, which stopped
           * meaning anything once the fog came out. Painting the sky on its own
           * tests the sky rather than whatever the camera happened to be
           * pointing at, and "did anything get drawn" is the property that
           * actually matters: sky above ground, nothing at all below it.
           */
          const probe = (camY) => {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#04060c';
            ctx.fillRect(0, 0, 800, 500);
            const c3 = C.createCamera(800, 500);
            c3.x = 400;
            c3.y = camY;
            RW.drawSky(ctx, c3, C.camOrigin(c3), 800, 500);
            const d = ctx.getImageData(0, 0, 800, 500).data;
            let changed = 0;
            let brightest = 0;
            for (let i = 0; i < d.length; i += 4) {
              if (d[i] !== 4 || d[i + 1] !== 6 || d[i + 2] !== 12) changed += 1;
              const v = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
              if (v > brightest) brightest = v;
            }
            return { changed, brightest };
          };

          const surface = probe(80);
          if (surface.changed < 800 * 500 * 0.3) {
            return `the sky only painted ${surface.changed} px above ground - it is missing`;
          }
          // A floor, not a claim about which feature is brightest: the hills sit
          // in front of the sun, so the peak is whatever survives them. Deep rock
          // reads about 40 luma, so anything near 100 means there is light and
          // detail up there rather than a flat dark band.
          if (surface.brightest < 100) {
            return `the brightest thing in the sky is ${surface.brightest.toFixed(1)} luma - the sky is flat and dark`;
          }

          const deep = probe(300 * 32);
          if (deep.changed !== 0) {
            return `the sky painted ${deep.changed} px 9,600 ft down`;
          }
          return ok(`sky paints ${surface.changed} px above ground, 0 px at depth`);
        });

        await check('the rendered frame is not blank', () => {
          const { data } = frameAt(60);
          const seen = new Set();
          for (let i = 0; i < data.length; i += 4 * 97) {
            seen.add(`${data[i] >> 3},${data[i + 1] >> 3},${data[i + 2] >> 3}`);
          }
          if (seen.size < 8) return `only ${seen.size} distinct colours - the frame is flat`;
          return ok(`${seen.size} distinct colours sampled`);
        });

        await check('index.html wires the canvas and the app root', async () => {
          const html = await (await fetch('../index.html')).text();
          if (!html.includes('id="game"')) return 'no canvas in index.html';
          if (!html.includes('id="app"')) return 'no app root in index.html';
          if (!html.includes('./src/main.js')) return 'main.js is not loaded by index.html';
          if (!html.includes('./styles/game.css')) return 'game.css is not linked';
          // The document language drives screen readers and hyphenation, and it
          // is the one part of a localisation that is invisible if it is wrong.
          if (!/lang="sl"/.test(html)) return 'index.html does not declare lang="sl"';
          return true;
        });

        await check('every stylesheet the game asks for exists', async () => {
          const res = await fetch('../styles/game.css');
          if (!res.ok) return `game.css is ${res.status}`;
          const css = await res.text();
          // Each of these is an element the code creates, so a missing rule means
          // an unstyled element on screen - which is how the RNOV badge would
          // fail if someone renamed the class in one file and not the other.
          for (const sel of [
            '.hud', '.meter-fill', '.modal-card', '.toast', '.radar', '.gauge',
            '.title-name', '.dock-note',
          ]) {
            if (!css.includes(sel)) return `game.css has no ${sel} rule`;
          }
          return true;
        });
        }
      } catch (e) {
        log(`FAIL  HARNESS CRASH: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`);
      }

      finish();
    </script>
  </body>
</html>
